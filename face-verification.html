<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Face Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 32px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            transform: scaleX(-1);
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .face-guide {
            width: 70%;
            height: 70%;
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 50%;
        }
        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            z-index: 2;
        }
        .verify-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
            cursor: pointer;
            z-index: 2;
        }
        .verify-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
<div class="container">
    <video id="video" autoplay muted playsinline></video>
    <div class="overlay"><div class="face-guide"></div></div>
    <div class="status" id="status">Loading face models...</div>
    <button class="verify-btn" id="verifyBtn" disabled>Initializing...</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
    let modelsLoaded = false;
    let stream = null;
    let videoElement = null;
    let isProcessing = false;
    const statusDiv = document.getElementById('status');
    const verifyBtn = document.getElementById('verifyBtn');
    const video = document.getElementById('video');

    function sendDescriptor(descriptor) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'descriptor',
            descriptor: Array.from(descriptor)
        }));
    }

    function sendError(errorMsg) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'error',
            error: errorMsg
        }));
    }

    async function loadModels() {
        try {
            statusDiv.innerText = 'Loading AI models...';
            // Use a reliable CDN for models to ensure they load correctly in the WebView
            const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            statusDiv.innerText = 'Models ready. Starting camera...';
            await startCamera();
        } catch (err) {
            console.error('Model load error:', err);
            statusDiv.innerText = 'Failed to load models. Checking connection...';
            sendError('Model load error: ' + err.message);
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
    }

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                } 
            });
            video.srcObject = stream;
            videoElement = video;
            await video.play();
            statusDiv.innerText = 'Position your face in the center';
            verifyBtn.disabled = false;
            verifyBtn.innerText = 'Capture Face';
            // Inform RN that we are ready
            window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ready' }));
        } catch (err) {
            console.error('Camera error:', err);
            statusDiv.innerText = 'Camera access error: ' + err.message;
            sendError('Camera error: ' + err.message);
        }
    }

    async function captureAndVerify() {
        if (!modelsLoaded || isProcessing) return;
        isProcessing = true;
        verifyBtn.disabled = true;
        verifyBtn.innerText = 'Verifying...';
        statusDiv.innerText = 'Analyzing face...';

        try {
            const detection = await faceapi.detectSingleFace(videoElement, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();

            // Capture frame as base64
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0);
            const base64Image = canvas.toDataURL('image/jpeg', 0.7);

            window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'descriptor',
                image: base64Image,
                descriptor: Array.from(detection.descriptor)
            }));
            statusDiv.innerText = 'Descriptor captured. Verifying...';
        } catch (err) {
            console.error(err);
            statusDiv.innerText = 'Verification error';
            sendError(err.message);
            isProcessing = false;
            verifyBtn.disabled = false;
            verifyBtn.innerText = 'Retry';
        }
    }

    verifyBtn.addEventListener('click', captureAndVerify);
    loadModels();

    window.addEventListener('beforeunload', () => {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    });
</script>
</body>
</html>
