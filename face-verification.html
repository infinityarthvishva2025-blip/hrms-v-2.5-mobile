<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>Face Verification</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --rc:#374151;--rg:rgba(55,65,81,0.15);
      --blue:#2076C7;--teal:#1CADA3;--amber:#F59E0B;--green:#10B981;--red:#EF4444;
    }
    body{
      background:#080C14;
      display:flex;flex-direction:column;align-items:center;
      min-height:100vh;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
      color:#F9FAFB;
    }

    #loadingOverlay{
      position:fixed;inset:0;background:#080C14;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:100;transition:opacity .2s ease;
    }
    #loadingOverlay.hidden{opacity:0;pointer-events:none}
    .loader-ring{
      width:40px;height:40px;border-radius:50%;
      border:3px solid rgba(255,255,255,.08);border-top-color:var(--blue);
      animation:spin .6s linear infinite;margin-bottom:15px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .hdr{width:100%;padding:env(safe-area-inset-top,15px) 24px 0;text-align:center}
    .hdr-title{font-size:18px;font-weight:800}
    .hdr-sub{font-size:12px;color:#6B7280;margin-top:2px}

    .cam-stage{
      position:relative;margin-top:20px;
      width:min(280px,80vw);height:min(280px,80vw);
      padding:10px;
    }
    .cam-wrap{
      position:relative;width:100%;height:100%;
      border-radius:50%;overflow:hidden;background:#000;
    }
    video{
      width:100%;height:100%;object-fit:cover;
      display:block;transform:scaleX(-1);
    }
    .ring-glow{
      position:absolute;inset:0;border-radius:50%;
      background:radial-gradient(circle,var(--rg) 0%,transparent 70%);
      pointer-events:none;z-index:2;
    }
    .ring-svg{
      position:absolute;top:-5px;left:-5px;
      width:calc(100% + 10px);height:calc(100% + 10px);
      pointer-events:none;z-index:3;
    }
    .ring-arc{
      fill:none;stroke:var(--rc);stroke-width:3;stroke-linecap:round;
      transition:stroke .2s ease;transform-origin:center;
    }
    .ring-arc.spinning{animation:rotateCW 2s linear infinite}
    @keyframes rotateCW{to{transform:rotate(360deg)}}

    .face-oval{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:65%;height:80%;border:1px dashed rgba(255,255,255,.15);border-radius:50%;
      z-index:1;transition:border-color .2s;
    }
    .face-oval.lit{border-color:var(--green)}

    .status-wrap{margin-top:25px;text-align:center;padding:0 24px;min-height:70px}
    .s-text{font-size:15px;font-weight:700;color:#F9FAFB}
    .s-sub{font-size:12px;color:#6B7280;margin-top:4px}

    .prog-wrap{width:min(240px,70vw);height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:15px;overflow:hidden}
    .prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0%;transition:width .15s ease}

    .btn-row{display:flex;padding:20px 24px calc(env(safe-area-inset-bottom,0px) + 20px);width:100%;max-width:320px}
    .btn-cancel{
      flex:1;background:rgba(255,255,255,.05);color:#9CA3AF;
      border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:15px;
      font-size:14px;font-weight:600;cursor:pointer;
    }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loader-ring"></div>
  <div class="loader-text">Waking up AI...</div>
</div>

<div class="hdr">
  <div class="hdr-title">Face Check</div>
  <div class="hdr-sub">Look at the camera</div>
</div>

<div class="cam-stage">
  <div class="cam-wrap">
    <video id="video" autoplay muted playsinline></video>
    <div class="face-oval" id="faceOval"></div>
  </div>
  <div class="ring-glow" id="glow"></div>
  <svg class="ring-svg" viewBox="0 0 320 320">
    <circle class="ring-arc spinning" cx="160" cy="160" r="158" id="arc" stroke-dasharray="10 15"/>
  </svg>
</div>

<div class="status-wrap">
  <div class="s-text" id="sTxt">Preparing...</div>
  <div class="s-sub" id="sSub">Wait a second</div>
</div>

<div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>

<div class="btn-row">
  <button class="btn-cancel" id="cancelBtn">Cancel</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const video = document.getElementById('video');
const arc = document.getElementById('arc');
const sTxt = document.getElementById('sTxt');
const sSub = document.getElementById('sSub');
const prog = document.getElementById('prog');
const faceOval = document.getElementById('faceOval');
const lo = document.getElementById('loadingOverlay');

let stream = null, isProcessing = false;
let detInterval = null;
const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
const SCAN_OPTS = new faceapi.TinyFaceDetectorOptions({ inputSize: 128, scoreThreshold: 0.5 });

function postRN(obj) { try { window.ReactNativeWebView.postMessage(JSON.stringify(obj)); } catch(e) {} }

function setUI(txt, sub, p, color) {
  sTxt.textContent = txt;
  sSub.textContent = sub;
  prog.style.width = p + '%';
  if (color) {
    document.documentElement.style.setProperty('--rc', color);
    arc.style.stroke = color;
  }
}

async function start() {
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'user', width: 360, height: 360 }, 
      audio: false 
    });
    video.srcObject = stream;
    
    lo.classList.add('hidden');
    setUI('Scanning...', 'Keep your face visible', 10, '#2076C7');
    postRN({ type: 'ready' });
    
    // High-speed scan: 100ms interval
    detInterval = setInterval(async () => {
      if (isProcessing || video.readyState < 2) return;
      
      const det = await faceapi.detectSingleFace(video, SCAN_OPTS);
      if (det && det.score > 0.7) {
        isProcessing = true;
        capture();
      }
    }, 100);
    
  } catch (e) {
    setUI('Error', e.message, 0, '#EF4444');
    postRN({ type: 'error', error: e.message });
  }
}

async function capture() {
  setUI('Verifying...', 'One moment...', 80, '#F59E0B');
  faceOval.classList.add('lit');
  arc.classList.remove('spinning');
  
  try {
    // Single heavy pass for descriptor
    const det = await faceapi.detectSingleFace(video, SCAN_OPTS).withFaceLandmarks().withFaceDescriptor();
    
    if (!det) {
      isProcessing = false;
      faceOval.classList.remove('lit');
      arc.classList.add('spinning');
      return;
    }

    if (window.FACE_OP !== 'register') {
      const saved = window.USER_FACE_DESCRIPTOR;
      if (saved) {
        const dist = faceapi.euclideanDistance(det.descriptor, new Float32Array(Object.values(saved)));
        if (dist > 0.55) {
          setUI('No Match', 'Try again', 0, '#EF4444');
          setTimeout(() => { isProcessing = false; setUI('Scanning...', 'Try again', 10, '#2076C7'); }, 1500);
          return;
        }
      }
    }

    const canvas = document.createElement('canvas');
    canvas.width = 300; canvas.height = 300;
    canvas.getContext('2d').drawImage(video, 0, 0, 300, 300);
    
    setUI('Success!', 'Redirecting...', 100, '#10B981');
    postRN({ 
      type: 'descriptor', 
      descriptor: Array.from(det.descriptor), 
      image: canvas.toDataURL('image/jpeg', 0.5) 
    });
    
  } catch (e) {
    isProcessing = false;
  }
}

window.startVerification = () => { isProcessing = false; faceOval.classList.remove('lit'); };
document.getElementById('cancelBtn').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  postRN({ type: 'cancel' });
};

start();
</script>
</body>
</html>
